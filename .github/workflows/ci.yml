name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg imagemagick libheif1 libimage-exiftool-perl libraw-bin libvips-tools
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test Rust
        run: cargo test --all-targets --all-features
      - name: Check shell scripts
        run: bash -n scripts/*.sh tests/e2e-server.sh
      - name: Install browser tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Type-check browser tests
        run: npm run typecheck
      - name: Test browser workflows
        run: npm run test:e2e
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
